<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store Management</title>
</head>
<body>
<script>
    let books = [
        { title: "JavaScript Basics", author: "Anu", price: 450, available: true },
        { title: "HTML & CSS", author: "Devi", price: 350, available: false }
    ];

    console.log("All Books:");
    for (let book of books) {
        console.log(`Title: ${book.title}, Author: ${book.author}, Price: ${book.price} ₹, Available: ${book.available}`);
    }

    console.log("Available Books:");
    for (let book of books) {
        if (book.available) {
            console.log(`Title: ${book.title}, Author: ${book.author}, Price: ${book.price} ₹`);
        }
    }

    books.push({ title: "Node.js Guide", author: "Ravi", price: 600, available: true });
    console.log("After Adding:");
    console.log(books.map(book => book.title).join(", "));

    let bookToUpdate = books.find(b => b.title === "JavaScript Basics");
    if (bookToUpdate) {
        bookToUpdate.price = 500;
    }
    console.log("After Price Update:");
    console.log(`${bookToUpdate.title} - ${bookToUpdate.price} ₹`);

    books = books.filter(b => b.title !== "JavaScript Basics");
    console.log("After Deletion:");
    console.log(books.map(book => book.title).join(", "));
</script>
</body>
</html>
