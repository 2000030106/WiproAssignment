<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Multimedia Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }
        video, audio, embed, iframe, svg {
            display: block;
            margin-top: 10px;
            margin-bottom: 20px;
            max-width: 100%;
        }
        .section-title {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>HTML5 Multimedia Lab</h1>
<p>This page demonstrates video, audio, embed (PDF), iframe, and inline SVG. Below is a visual preview.</p>


<div class="section-title">Video (birds.mp4)</div>
<video width="480" controls poster="poster.jpg">
    <source src="birds.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>


<div class="section-title">Audio (music.mp3)</div>
<audio controls loop>
    <source src="music.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>


<div class="section-title">Embed (document.pdf)</div>
<embed src="HTML CSS TASKS.pdf" type="application/pdf" width="480" height="300">
<p>If not visible, <a href="HTML CSS TASKS.pdf">download document.pdf</a></p>


<div class="section-title">Iframe (demo.html)</div>
<iframe src="lab5.html" width="480" height="200" title="Embedded page preview"></iframe>


<div class="section-title">Inline SVG</div>
<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="40" fill="red" />
</svg>

</body>
</html>
