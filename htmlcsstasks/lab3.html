<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Grocery Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 20px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        form {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        fieldset {
            border: 2px solid #4CAF50;
            margin-bottom: 15px;
            padding: 10px;
        }
        legend {
            font-weight: bold;
            color: #4CAF50;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="checkbox"], input[type="radio"] {
            width: auto;
        }
        .buttons {
            text-align: center;
        }
        input[type="submit"], input[type="reset"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="reset"] {
            background-color: #e74c3c;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        input[type="reset"]:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h2>Online Grocery Order</h2>

    <form action="confirmation.html" method="POST">
        
        <fieldset>
            <legend>Customer Details</legend>
            
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="fullname" placeholder="Enter your full name" required autofocus>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            
            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
            
            <label for="address">Delivery Address:</label>
            <textarea id="address" name="address" placeholder="Enter your delivery address" required></textarea>
        </fieldset>
        
        <fieldset>
            <legend>Order Details</legend>
            
            <label>Grocery Items:</label>
            <input type="checkbox" name="items[]" value="Rice"> Rice
            <input type="checkbox" name="items[]" value="Milk"> Milk
            <input type="checkbox" name="items[]" value="Bread"> Bread
            <input type="checkbox" name="items[]" value="Eggs"> Eggs
            <input type="checkbox" name="items[]" value="Sugar"> Sugar
            
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="10" required>
            
            <label for="date">Delivery Date:</label>
            <input type="date" id="date" name="delivery_date" required>
            
            <label for="time">Preferred Delivery Time:</label>
            <input type="time" id="time" name="delivery_time">
            
            <label>Payment Method:</label>
            <input type="radio" name="payment" value="Cash on Delivery" required> Cash on Delivery
            <input type="radio" name="payment" value="UPI"> UPI
            <input type="radio" name="payment" value="Card"> Card
        </fieldset>
        
        <label for="instructions">Special Instructions:</label>
        <textarea id="instructions" name="instructions" placeholder="Any additional notes (optional)"></textarea>
        
        <p>
            <input type="checkbox" name="confirm" required> I confirm my order
        </p>
        
        <div class="buttons">
            <input type="submit" value="Place Order">
            <input type="reset" value="Reset Form">
        </div>
        
    </form>

</body>
</html>
